name: Atualizar estatisticas do jogo

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-stats.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar dados do Roblox e Discord
        run: |
          python3 - << 'EOF'
          import json, urllib.request, datetime

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "UltimaMarchaBR-Site/1.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read().decode("utf-8"))

          try:
              old = json.load(open("js/stats.json", encoding="utf-8"))
          except Exception:
              old = {}

          try:
              rb = get_json("https://games.roblox.com/v1/games?universeIds=10765368145")["data"][0]
              old["playing"] = rb.get("playing", old.get("playing"))
              old["visits"] = rb.get("visits", old.get("visits"))
              old["favoritedCount"] = rb.get("favoritedCount", old.get("favoritedCount"))
              old["maxPlayers"] = rb.get("maxPlayers", old.get("maxPlayers"))
          except Exception as e:
              print("Roblox API warning:", e)

          try:
              dc = get_json("https://discord.com/api/v10/invites/zy2exUyTEX?with_counts=true")
              old["discordMembers"] = dc.get("approximate_member_count", old.get("discordMembers"))
              old["discordOnline"] = dc.get("approximate_presence_count", old.get("discordOnline"))
          except Exception as e:
              print("Discord API warning:", e)

          old["updatedAt"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          with open("js/stats.json", "w", encoding="utf-8") as f:
              json.dump(old, f, indent=2)
          EOF
      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/stats.json
          git diff --staged --quiet || (git commit -m "chore: atualizar estatisticas do jogo" && git push)
